name: Sydney Buddy backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Backend unit and HTTP tests
        run: |
          python3 server/app.py > /tmp/sydney-buddy.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health > /dev/null; then break; fi
            sleep 1
          done
          python3 -m unittest discover -s server/tests -v
      - name: Official H-MEM conformance
        run: HMEM_IMPL="$PWD/server/vendor/hmem/src/index.ts" node --experimental-transform-types server/vendor/hmem/conformance/runner.ts

name: Sydney Buddy backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sydneybuddy
          POSTGRES_USER: sydneybuddy
          POSTGRES_PASSWORD: sydneybuddy_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sydneybuddy -d sydneybuddy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__SydneyBuddy: Host=localhost;Port=5432;Database=sydneybuddy;Username=sydneybuddy;Password=sydneybuddy_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate iOS English catalog and format tokens
        run: |
          python3 scripts/generate_localizations.py --ios-only --check
          python3 -m unittest discover -s scripts/tests -p test_english_localization_guard.py
      - name: Restore backend and test dependencies
        run: dotnet restore server-dotnet/SydneyBuddy.Api.Tests/SydneyBuddy.Api.Tests.csproj
      - name: Build backend and tests
        run: dotnet build server-dotnet/SydneyBuddy.Api.Tests/SydneyBuddy.Api.Tests.csproj --configuration Release --no-restore
      - name: Backend unit and HTTP compatibility tests
        run: dotnet test server-dotnet/SydneyBuddy.Api.Tests/SydneyBuddy.Api.Tests.csproj --configuration Release --no-build
      - name: Official H-MEM conformance
        run: HMEM_IMPL="$PWD/server/vendor/hmem/src/index.ts" node --experimental-transform-types server/vendor/hmem/conformance/runner.ts

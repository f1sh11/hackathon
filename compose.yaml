name: roam-mvp
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roam}
      POSTGRES_USER: roam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roam_local_dev_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roam -d ${POSTGRES_DB:-roam}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    ports:
      - "127.0.0.1:${ROAM_PORT:-5080}:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Roam: Host=db;Port=5432;Database=${POSTGRES_DB:-roam};Username=roam;Password=${POSTGRES_PASSWORD:-roam_local_dev_only}
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres-data:
